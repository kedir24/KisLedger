name: smartledger
description: Double-entry bookkeeping for small businesses in Ethiopia.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  intl: ^0.20.2
  uuid: ^4.4.0
  pdf: ^3.11.1
  printing: ^5.13.3
  supabase_flutter: ^2.8.0
  # Ethiopian calendar conversion is hand-rolled in lib/utils/ethiopian_calendar.dart
  # (verified against Wikipedia reference dates) — no extra package needed.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
        - asset: assets/fonts/NotoSansEthiopic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
